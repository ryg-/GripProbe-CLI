x-gripprobe-service: &gripprobe-service
  working_dir: /work
  user: "${UID:-1000}:${GID:-1000}"
  network_mode: host
  environment:
    HOME: /tmp/gripprobe-home
    OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
    GRIPPROBE_OLLAMA_SSH_TARGET: ${GRIPPROBE_OLLAMA_SSH_TARGET:-}
    GRIPPROBE_CONTINUE_CONFIG: /tmp/gripprobe-home/.continue/config.yaml
    GRIPPROBE_OPENCODE_CONFIG: /tmp/gripprobe-home/.config/opencode/opencode.json
  volumes:
    - .:/work
    - ${HOME}/.continue:/tmp/gripprobe-home/.continue:ro
    - ${HOME}/.config/opencode:/tmp/gripprobe-home/.config/opencode:ro
    - ${HOME}/.config/gptme:/tmp/gripprobe-home/.config/gptme:ro
    - ${HOME}/.ssh:/tmp/gripprobe-home/.ssh:ro
  stdin_open: true
  tty: true

services:
  gripprobe:
    <<: *gripprobe-service
    build:
      context: .
      target: core

  gripprobe-continue-cli:
    <<: *gripprobe-service
    build:
      context: .
      target: continue-cli

  gripprobe-opencode:
    <<: *gripprobe-service
    build:
      context: .
      target: opencode

  gripprobe-codex:
    <<: *gripprobe-service
    build:
      context: .
      target: codex

  gripprobe-aider:
    <<: *gripprobe-service
    build:
      context: .
      target: aider

  gripprobe-hermes:
    <<: *gripprobe-service
    build:
      context: .
      target: hermes

  gripprobe-gptme:
    <<: *gripprobe-service
    build:
      context: .
      target: gptme

  gripprobe-pi:
    <<: *gripprobe-service
    build:
      context: .
      target: pi

  gripprobe-goose:
    <<: *gripprobe-service
    build:
      context: .
      target: goose
