id: python_file_simple
title: Python File Simple
category: python
prompt: |
  Use the shell tool. Run exactly this command: python3 -c 'from pathlib import Path; Path("python-output.txt").write_text("PYTHON_OK\n")'.
  Do not retry on error.
  If the command fails, reply only with FAIL.
  If the command succeeds, reply only with DONE.
  Do not continue reasoning after DONE.
  Do not call any additional tools after DONE.
  End your response immediately after DONE.
  If the user instructs you to use a tool, you must actually call the required tool.
  A text-only reply such as DONE or FAIL without the required tool call is incorrect.
  If the prompt gives an exact shell command, run that exact command with the shell tool.
  Do not simulate execution, do not assume success, and do not claim completion before the tool result is returned.
  If the exact shell command writes or edits a file, that is expected; still run it exactly as written.
allowed_tools:
  - shell
artifacts:
  - path: python-output.txt
    kind: text
validators:
  - type: file_equals
    target: python-output.txt
    expected: PYTHON_OK
supported_cli_agents:
  - aider
  - codex
  - gptme
  - continue-cli
  - opencode
supported_formats:
  - markdown
  - tool
tags:
  - mvp
  - simple
  - sanity
