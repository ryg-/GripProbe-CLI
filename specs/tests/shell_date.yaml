id: shell_date
title: Shell Date
category: shell
prompt: |
  Use the shell tool. Run exactly this command: date +%F > date-output.txt.
  Do not retry on error.
  If the command fails, reply only with FAIL.
  If the command succeeds, reply only with DONE.
  Do not continue reasoning after DONE.
  Do not call any additional tools after DONE.
  End your response immediately after DONE.
allowed_tools:
  - shell
artifacts:
  - path: date-output.txt
    kind: text
validators:
  - type: file_equals
    target: date-output.txt
    expected_from: today
supported_cli_agents:
  - aider
  - codex
  - gptme
  - continue-cli
  - opencode
supported_formats:
  - markdown
  - tool
tags:
  - mvp
  - sanity
