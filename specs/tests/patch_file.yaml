id: patch_file
title: Patch File
category: patch
prompt: |
  Use the read tool to inspect patch-target.txt in the current workspace.
  Then use the patch tool to replace the exact line STATUS=old with STATUS=new in patch-target.txt in the current workspace.
  Do not retry on error.
  If the edit fails, reply only with FAIL.
  If the edit succeeds, reply only with DONE.
  Do not continue reasoning after DONE.
  Do not call any additional tools after DONE.
  End your response immediately after DONE.
  If the user instructs you to use a tool, you must actually call the required tool.
  A text-only reply such as DONE or FAIL without the required tool call is incorrect.
  Do not simulate execution, do not assume success, and do not claim completion before the tool result is returned.
  If the exact shell command writes or edits a file, that is expected; still run it exactly as written.

allowed_tools:
  - read
  - patch
validators:
  - type: patch_applied
    target_file: patch-target.txt
    expected_line: STATUS=new
supported_cli_agents:
  - aider
  - codex
  - gptme
  - continue-cli
  - opencode
supported_formats:
  - markdown
  - tool
tags:
  - mvp
  - sanity
