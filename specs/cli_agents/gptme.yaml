id: gptme
label: gptme
executable: gptme
default_args:
  - --non-interactive
  - --no-confirm
supported_formats:
  - markdown
  - tool
env: {}
default_tools:
  - shell
  - patch
  - read
  - save
tool_dialect:
  - id: shell
    raw_name: shell
    canonical_name: Bash
    role: command
  - id: complete
    raw_name: complete
    canonical_name: Exit
    role: terminate
