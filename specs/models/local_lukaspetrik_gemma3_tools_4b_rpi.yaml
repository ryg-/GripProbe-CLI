id: local_lukaspetrik_gemma3_tools_4b_rpi
label: local/lukaspetrik/gemma3-tools:4b_rpi
family: gemma
size_class: small
parameters_b: 4
quantization: null
backends:
  - id: ollama
    model_id: lukaspetrik/gemma3-tools:4b
    cli_agent_model_id: local/lukaspetrik/gemma3-tools:4b
tags:
  - local
  - rpi
  - small
  - tool-capable
supported_formats:
#  - markdown
  - tool
policy_overrides:
  cli_agent_options:
    continue-cli:
      context_length: 4096
      minimal_system_prompt: true
    codex:
      telemetry_proxy_filter_tools: true
      proxy_include_exit_tool: false
      telemetry_proxy_strip_git_context: false
      telemetry_proxy_strip_permissions_instructions: true
      telemetry_proxy_strip_commit_signature_context: false
      telemetry_proxy_strip_skills_instructions: true
      ignore_user_config: true
      ignore_rules: true
    gptme:
      filter_tools: true
      disable_proxy: true
      system_prompt: custom
      custom_system_prompt: Use tools first. Keep reasoning extremely short. Reply only with tool calls and final DONE/FAIL.
    pi:
      system_prompt: Use tools first. Keep reasoning extremely short. If a bash command succeeds, reply only with DONE. If it fails, reply only with FAIL.
      offline: true
      skip_version_check: true
      telemetry_enabled: false
  telemetry_proxy_filter_tools: false
  telemetry_proxy_strip_git_context: false
  telemetry_proxy_strip_commit_signature_context: false
#  telemetry_proxy_reasoning_effort: none
#  telemetry_proxy_temperature_override: 0.0
#  prompt_append_no_think: true
  proxy_include_exit_tool: false
  #proxy_include_tool_names:
  #  - read
  #  - patch
  cli_agent_timeout_seconds:
    gptme: 600
    continue-cli: 900
